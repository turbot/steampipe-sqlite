# Used by `make release-dry-run`, which runs GoReleaser in goreleaser-cross.
# The Steampipe Anywhere release workflows (turbot/steampipe-workflows) don't
# use this file: they build each extension with `make build`, running in
# goreleaser-cross for the Darwin targets with the same CC and
# MACOSX_DEPLOYMENT_TARGET as below.
version: 2

builds:
  - id: steampipe_sqlite_net_linux_arm64
    binary: steampipe_sqlite_net.so
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_LDFLAGS=-Wl,--unresolved-symbols=ignore-in-object-files
      - CC=aarch64-linux-gnu-gcc
    flags:
      - -tags=netgo
      - -buildmode=c-shared
    ldflags:
      - -s -w

  - id: steampipe_sqlite_net_linux_amd64
    binary: steampipe_sqlite_net.so
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_LDFLAGS=-Wl,--unresolved-symbols=ignore-in-object-files
      - CC=x86_64-linux-gnu-gcc
    flags:
      - -tags=netgo
      - -buildmode=c-shared
    ldflags:
      - -s -w

  # Without MACOSX_DEPLOYMENT_TARGET, osxcross sets the minimum macOS version
  # (LC_BUILD_VERSION minos) to its own default rather than 14.0.
  - id: steampipe_sqlite_net_darwin_arm64
    binary: steampipe_sqlite_net.so
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CC=oa64-clang
      - CGO_LDFLAGS=-Wl,-undefined,dynamic_lookup
      - MACOSX_DEPLOYMENT_TARGET=14.0
    flags:
      - -tags=netgo
      - -buildmode=c-shared
    ldflags:
      - -s -w

  - id: steampipe_sqlite_net_darwin_amd64
    binary: steampipe_sqlite_net.so
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CC=o64-clang
      - CGO_LDFLAGS=-Wl,-undefined,dynamic_lookup
      - MACOSX_DEPLOYMENT_TARGET=14.0
    flags:
      - -tags=netgo
      - -buildmode=c-shared
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    id: binaries
    name_template: "steampipe_sqlite_net.{{ .Os }}_{{ .Arch }}"
    ids:
      - steampipe_sqlite_net_linux_arm64
      - steampipe_sqlite_net_linux_amd64
      - steampipe_sqlite_net_darwin_arm64
      - steampipe_sqlite_net_darwin_amd64
    files:
      - none*

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
